name: Build installable SooCool plugin

on:
  push:
    branches:
      - fix/maintenance-empty-response-contract-2026-09-02

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runtime tree matches main
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- \
            assets \
            languages \
            src \
            soocool-for-woocommerce.php \
            uninstall.php \
            readme.txt \
            changelog.txt \
            LICENSE

      - name: Run package regressions
        run: |
          php tests/sync-scheduling-regression.php
          php tests/order-actions-recovery-regression.php
          python3 tools/build-css-assets.py --check
          python3 tools/build-translations.py --check

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release verify
          mkdir -p release/soocool-for-woocommerce verify
          cp -a \
            assets \
            languages \
            src \
            soocool-for-woocommerce.php \
            uninstall.php \
            readme.txt \
            changelog.txt \
            LICENSE \
            release/soocool-for-woocommerce/

          find release/soocool-for-woocommerce -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

          test "$(find release/soocool-for-woocommerce -type f -name '*.php' | wc -l)" -gt 0
          test ! -e release/soocool-for-woocommerce/.git
          test ! -e release/soocool-for-woocommerce/.github
          test ! -e release/soocool-for-woocommerce/tests
          test ! -e release/soocool-for-woocommerce/tools
          test ! -e release/soocool-for-woocommerce/node_modules
          test ! -e release/soocool-for-woocommerce/vendor

          cd release
          zip -X -q -r soocool-for-woocommerce.zip soocool-for-woocommerce
          sha256sum soocool-for-woocommerce.zip > soocool-for-woocommerce.zip.sha256
          unzip -q soocool-for-woocommerce.zip -d ../verify
          diff -qr soocool-for-woocommerce ../verify/soocool-for-woocommerce
          test "$(find ../verify -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test -f ../verify/soocool-for-woocommerce/soocool-for-woocommerce.php
          grep -F 'Version: 0.7.147' ../verify/soocool-for-woocommerce/soocool-for-woocommerce.php >/dev/null
          grep -F 'Stable tag: 0.7.147' ../verify/soocool-for-woocommerce/readme.txt >/dev/null
          grep -F '= 0.7.147 =' ../verify/soocool-for-woocommerce/changelog.txt >/dev/null

      - name: Upload verified plugin
        uses: actions/upload-artifact@v4
        with:
          name: soocool-installable-plugin-28ffe3c0
          path: |
            release/soocool-for-woocommerce.zip
            release/soocool-for-woocommerce.zip.sha256
          retention-days: 1
          compression-level: 0
