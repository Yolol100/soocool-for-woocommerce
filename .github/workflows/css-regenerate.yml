name: Temporary CSS Regeneration

on:
  push:
    branches:
      - audit/phased-runtime-hardening

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate production CSS
        run: python3 tools/build-css-assets.py --write

      - name: Upload regenerated CSS
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regenerated-css
          path: |
            assets/build/admin-orders.min.css
            assets/frontend/checkout-delivery.min.css
          if-no-files-found: error
          retention-days: 1
