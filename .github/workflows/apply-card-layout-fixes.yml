name: Apply card layout fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified plugin fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          root = Path('.')
          css_path = root / 'assets/build/admin-settings.css'
          css_min_path = root / 'assets/build/admin-settings.min.css'
          js_path = root / 'assets/build/admin.js'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          css = css_path.read_text(encoding='utf-8')
          css = replace_once(css,
              '''.soocool-delivery-schedule-card__actions .components-toggle-control {
          display: inline-flex;''',
              '''.soocool-delivery-schedule-card__actions > .components-base-control,
          .soocool-delivery-schedule-card__actions > .components-button {
            flex: 0 0 auto;
            margin: 0;
          }

          .soocool-delivery-schedule-card__actions .components-toggle-control {
          display: inline-flex;''',
              'delivery action flex reset')
          css = replace_once(css,
              '''.soocool-delivery-schedule-card__actions .soocool-delivery-schedule-card__expand.components-button {
            color: var(--soocool-color-text);''',
              '''.soocool-delivery-schedule-card__actions .components-button.is-secondary.is-destructive + .soocool-delivery-schedule-card__expand.components-button {
            margin-inline-start: -4px;
          }

          .soocool-delivery-schedule-card__actions .soocool-delivery-schedule-card__expand.components-button {
            color: var(--soocool-color-text);''',
              'delivery expand spacing')
          css = replace_once(css,
              '''.soocool-pickup-status-summary .soocool-status-summary__badge {
            align-self: flex-start;''',
              '''.soocool-pickup-status-summary .soocool-status-summary__copy {
            width: 100%;
            flex: 0 0 auto;
          }

          .soocool-pickup-status-summary .soocool-status-summary__badge {
            align-self: flex-start;''',
              'pickup status copy sizing')
          css_path.write_text(css, encoding='utf-8')
          css_min_path.write_text(css, encoding='utf-8')

          js = js_path.read_text(encoding='utf-8')
          js = replace_once(js,
              "return el('details', { className: 'soocool-disclosure' + (props.className ? ' ' + props.className : ''), ref: detailsRef },",
              "return el('details', { id: props.id || undefined, className: 'soocool-disclosure' + (props.className ? ' ' + props.className : ''), ref: detailsRef },",
              'DisclosureCard id forwarding')
          js = replace_once(js,
              '''    function removeRule(index){
                var schedule = normalizeSchedule().filter(function(rule, ruleIndex){ return ruleIndex !== index; });''',
              '''    function remapRuleIndexedStateAfterRemoval(state, removedIndex){
                var next = {};
                Object.keys(state || {}).forEach(function(key){
                  var index = parseInt(key, 10);
                  if (!Number.isInteger(index) || index === removedIndex) { return; }
                  next[index > removedIndex ? index - 1 : index] = state[key];
                });
                return next;
              }
              function remapOpenSlotsAfterRuleRemoval(state, removedRuleIndex){
                var next = {};
                Object.keys(state || {}).forEach(function(key){
                  var match = /^(\\d+)-(\\d+)$/.exec(key);
                  if (!match) { return; }
                  var ruleIndex = parseInt(match[1], 10);
                  if (ruleIndex === removedRuleIndex) { return; }
                  var targetRuleIndex = ruleIndex > removedRuleIndex ? ruleIndex - 1 : ruleIndex;
                  next[String(targetRuleIndex) + '-' + match[2]] = state[key];
                });
                return next;
              }
              function remapOpenSlotsAfterSlotRemoval(state, ruleIndex, removedSlotIndex){
                var next = {};
                Object.keys(state || {}).forEach(function(key){
                  var match = /^(\\d+)-(\\d+)$/.exec(key);
                  if (!match) { return; }
                  var currentRuleIndex = parseInt(match[1], 10);
                  var slotIndex = parseInt(match[2], 10);
                  if (currentRuleIndex !== ruleIndex) {
                    next[key] = state[key];
                    return;
                  }
                  if (slotIndex === removedSlotIndex) { return; }
                  var targetSlotIndex = slotIndex > removedSlotIndex ? slotIndex - 1 : slotIndex;
                  next[String(ruleIndex) + '-' + String(targetSlotIndex)] = state[key];
                });
                return next;
              }
              function removeRule(index){
                var schedule = normalizeSchedule().filter(function(rule, ruleIndex){ return ruleIndex !== index; });''',
              'schedule state remap helpers')
          js = replace_once(js,
              '''      setSchedule(schedule);
              }
              function updateRule(index, key, value){''',
              '''      setSchedule(schedule);
                setOpenCards(function(current){ return remapRuleIndexedStateAfterRemoval(current, index); });
                setExpandedSlotLists(function(current){ return remapRuleIndexedStateAfterRemoval(current, index); });
                setOpenSlots(function(current){ return remapOpenSlotsAfterRuleRemoval(current, index); });
              }
              function updateRule(index, key, value){''',
              'rule removal state updates')
          js = replace_once(js,
              '''      schedule[ruleIndex] = rule;
                setSchedule(schedule);
              }
              function updateSlot(ruleIndex, slotIndex, key, value){''',
              '''      schedule[ruleIndex] = rule;
                setSchedule(schedule);
                setOpenSlots(function(current){ return remapOpenSlotsAfterSlotRemoval(current, ruleIndex, slotIndex); });
              }
              function updateSlot(ruleIndex, slotIndex, key, value){''',
              'slot removal state update')
          js_path.write_text(js, encoding='utf-8')
          PY
          test "$(git hash-object assets/build/admin-settings.css)" = "973b5488d98ce5274d7b09c0d29ee75d78bad860"
          test "$(git hash-object assets/build/admin-settings.min.css)" = "973b5488d98ce5274d7b09c0d29ee75d78bad860"
          test "$(git hash-object assets/build/admin.js)" = "d170e27009a9f05cbd10d75797f9010ea2c4a556"
      - name: Commit verified files
        shell: bash
        run: |
          rm -f .github/workflows/apply-card-layout-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/build/admin-settings.css assets/build/admin-settings.min.css assets/build/admin.js .github/workflows/apply-card-layout-fixes.yml
          git commit -m "Fix card layout spacing and schedule UI state"
          git push origin HEAD:main
