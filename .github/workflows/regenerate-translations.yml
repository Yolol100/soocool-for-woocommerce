name: Regenerate translations

on:
  push:
    branches:
      - fix/regenerate-translations-2026-09-02

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/regenerate-translations-2026-09-02

      - name: Regenerate catalogs
        run: python3 tools/build-translations.py --stamp

      - name: Commit generated catalogs
        run: |
          git diff --check
          git add languages/soocool-for-woocommerce.pot \
            languages/soocool-for-woocommerce-nl_NL.po \
            languages/soocool-for-woocommerce-nl_NL.mo
          if git diff --cached --quiet; then
            echo "Translation catalogs were already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate translation catalogs"
          git push origin HEAD:fix/regenerate-translations-2026-09-02
