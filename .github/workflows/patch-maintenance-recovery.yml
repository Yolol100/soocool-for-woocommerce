name: Patch maintenance recovery

on:
  push:
    branches:
      - fix/maintenance-recovery-semantics-2026-09-02

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/maintenance-recovery-semantics-2026-09-02

      - name: Apply surgical OrderActions patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/WooCommerce/OrderActions.php')
          source = path.read_text(encoding='utf-8')
          old = """\tpublic function schedule_send_to_soocool( int $order_id ): string {\n\t\treturn $this->schedule_initial_order_action( self::SYNC_HOOK, $order_id );\n\t}\n\n\tpublic function schedule_resync_order( int $order_id ): string {\n\t\treturn $this->schedule_initial_order_action( self::RESYNC_HOOK, $order_id );\n\t}\n\n\tprivate function schedule_initial_order_action( string $hook, int $order_id ): string {\n"""
          new = """\tpublic function schedule_send_to_soocool( int $order_id ): string {\n\t\treturn $this->schedule_initial_order_action( self::SYNC_HOOK, $order_id, false );\n\t}\n\n\tpublic function schedule_failed_order_recovery( int $order_id ): string {\n\t\treturn $this->schedule_initial_order_action( self::SYNC_HOOK, $order_id, true );\n\t}\n\n\tpublic function schedule_resync_order( int $order_id ): string {\n\t\treturn $this->schedule_initial_order_action( self::RESYNC_HOOK, $order_id, true );\n\t}\n\n\tprivate function schedule_initial_order_action( string $hook, int $order_id, bool $manual_when_linked ): string {\n"""
          if source.count(old) != 1:
              raise SystemExit('Expected one scheduling method block to patch.')
          source = source.replace(old, new, 1)

          old_return = "\t\t\treturn self::SYNC_HOOK === $hook ? self::QUEUE_DUPLICATE : self::QUEUE_MANUAL;"
          new_return = "\t\t\treturn $manual_when_linked ? self::QUEUE_MANUAL : self::QUEUE_DUPLICATE;"
          if source.count(old_return) != 1:
              raise SystemExit('Expected one linked-order result expression to patch.')
          source = source.replace(old_return, new_return, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate recovery behavior
        run: |
          php -l src/WooCommerce/OrderActions.php
          php -l src/Rest/MaintenanceController.php
          php -l tests/order-actions-recovery-regression.php
          php tests/sync-scheduling-regression.php
          php tests/order-actions-recovery-regression.php
          python3 tools/build-translations.py --check

      - name: Commit patch
        run: |
          git diff --check
          git add src/WooCommerce/OrderActions.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep maintenance recovery on canonical sync queue"
          git push origin HEAD:fix/maintenance-recovery-semantics-2026-09-02
