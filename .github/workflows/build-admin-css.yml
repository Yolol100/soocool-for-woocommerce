name: Build admin CSS

on:
  push:
    branches:
      - fix/admin-settings-css-minification-2026-09-02

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/admin-settings-css-minification-2026-09-02

      - name: Validate builder
        run: python3 -m py_compile tools/build-css-assets.py

      - name: Generate minified CSS
        run: python3 tools/build-css-assets.py --write

      - name: Verify generated CSS
        run: |
          python3 tools/build-css-assets.py --check
          test "$(git hash-object assets/build/admin-settings.css)" != "$(git hash-object assets/build/admin-settings.min.css)"
          test "$(wc -c < assets/build/admin-settings.min.css)" -lt "$(wc -c < assets/build/admin-settings.css)"
          grep -F '.soocool-shell :where(' assets/build/admin-settings.min.css >/dev/null || true
          git diff --check

      - name: Commit generated CSS
        run: |
          git add assets/build/admin-settings.min.css
          if git diff --cached --quiet; then
            echo "CSS asset already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate minified admin settings CSS"
          git push origin HEAD:fix/admin-settings-css-minification-2026-09-02
