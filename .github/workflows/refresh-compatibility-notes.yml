name: Refresh 0.7.147 compatibility notes

on:
  push:
    branches:
      - chore/compatibility-hardening-0.7.147-2026-09-02

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/compatibility-hardening-0.7.147-2026-09-02

      - name: Update full changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('changelog.txt')
          text = path.read_text(encoding='utf-8')
          marker = '= 0.7.147 =\n'
          if text.count(marker) != 1:
              raise SystemExit('Expected exactly one 0.7.147 changelog heading.')

          additions = [
              '* Houdt onderhoudsrecovery op de canonieke syncqueue, maar rapporteert al gekoppelde mislukte orders correct als handmatige controle in plaats van als queue-duplicate.',
              '* Herstelt echte productie-minificatie van de admin-instellingen-CSS en bewaakt CSS- en vertaalbuilds permanent tegen drift in CI.',
              '* Houdt de lege onderhoudsresponse structureel gelijk met niet-lege batches door alle queue-tellers als nul terug te geven.',
              '* Verifieert 0.7.147 in echte MySQL/WordPress/WooCommerce-runtimes op WordPress 6.5 + WooCommerce 8.2.5 + PHP 8.1 en WordPress 7.1 + WooCommerce 11.0.1 + PHP 8.4, inclusief HPOS, order-CRUD, lifecycle en reinstallability.',
          ]

          missing = [line for line in additions if line not in text]
          if missing:
              insertion = marker + ''.join(line + '\n' for line in missing)
              text = text.replace(marker, insertion, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify version and metadata
        run: |
          grep -F ' * Version: 0.7.147' soocool-for-woocommerce.php
          grep -F "define( 'SOOCOOL_VERSION', '0.7.147' );" soocool-for-woocommerce.php
          grep -F ' * WC tested up to: 11.0' soocool-for-woocommerce.php
          grep -F 'Tested up to: 7.1' readme.txt
          grep -F 'Stable tag: 0.7.147' readme.txt
          grep -F '= 0.7.147 =' readme.txt
          grep -F '= 0.7.147 =' changelog.txt
          test "$(wc -c < readme.txt)" -lt 10240
          python3 tools/build-css-assets.py --check
          python3 tools/build-translations.py --check
          git diff --check

      - name: Commit changelog
        run: |
          git add changelog.txt
          if git diff --cached --quiet; then
            echo 'Changelog already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize 0.7.147 compatibility changelog'
          git push origin HEAD:chore/compatibility-hardening-0.7.147-2026-09-02
